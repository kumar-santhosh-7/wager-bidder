server.port=8090
server.address=0.0.0.0
spring.application.name=ledger-bid-api

# XAMPP MySQL (phpMyAdmin → http://localhost/phpmyadmin)
# Empty password is the XAMPP default. Set spring.datasource.password if you changed it.
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/ledger_bid?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false
spring.jackson.serialization.write-dates-as-timestamps=false

ledgerbid.seed=true
ledgerbid.withdraw-lock-minutes=5
ledgerbid.upload-dir=uploads

spring.servlet.multipart.max-file-size=4MB
spring.servlet.multipart.max-request-size=4MB
