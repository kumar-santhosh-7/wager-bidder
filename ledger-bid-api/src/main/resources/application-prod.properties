server.port=8090
server.address=0.0.0.0
spring.application.name=ledger-bid-api

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.show-sql=false
spring.jackson.serialization.write-dates-as-timestamps=false

ledgerbid.seed=${LEDGERBID_SEED:false}
ledgerbid.withdraw-lock-minutes=5
ledgerbid.upload-dir=${LEDGERBID_UPLOAD_DIR:/application/uploads}
ledgerbid.admin.username=${LEDGERBID_ADMIN_USERNAME:}
ledgerbid.admin.password=${LEDGERBID_ADMIN_PASSWORD:}
ledgerbid.admin.name=${LEDGERBID_ADMIN_NAME:House Admin}

spring.servlet.multipart.max-file-size=4MB
spring.servlet.multipart.max-request-size=4MB
