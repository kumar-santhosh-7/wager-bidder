# Deploy Ledger Bid API to ECS in the dedicated wager-bidder AWS account.
#
# Before the first run:
# 1. Create a separate AWS account (not vibuthar-academy 649058762344)
# 2. terraform -chdir=terraform init && terraform -chdir=terraform apply
# 3. GitHub repo Settings → Secrets and variables → Actions → Secrets
#      AWS_ACCESS_KEY_ID     = terraform output -raw github_actions_access_key_id
#      AWS_SECRET_ACCESS_KEY = terraform output -raw github_actions_secret_access_key
#    Must be Secrets, not Variables. Remove AWS_ROLE_ARN if it is still set.

name: Deploy to ECS

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to build and deploy
        required: true
        type: string
        default: main

concurrency:
  group: deploy-ecs-wager-bidder
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: wager-bidder
  ECS_CLUSTER: wager-bidder
  ECS_SERVICE: wager-bidder
  ECS_TASK_FAMILY: wager-bidder
  CONTAINER_NAME: wager-bidder

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.branch }}

      - name: Deploying ref
        run: echo "Deploying ${{ inputs.branch }} @ $(git rev-parse HEAD)"

      - name: Require AWS access key secrets
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "::error::Set repository secrets AWS_ACCESS_KEY_ID and AWS_SECRET_ACCESS_KEY. Values: terraform output -raw github_actions_access_key_id and github_actions_secret_access_key"
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image URI
        id: image
        run: echo "uri=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./ledger-bid-api
          file: ./ledger-bid-api/Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.uri }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Download current ECS task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition "${{ env.ECS_TASK_FAMILY }}" \
            --query taskDefinition \
            --output json \
          | jq 'del(
              .taskDefinitionArn,
              .revision,
              .status,
              .requiresAttributes,
              .compatibilities,
              .registeredAt,
              .registeredBy,
              .deregisteredAt
            )' > task-definition.json

      - name: Render task definition with new image
        id: render
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.image.outputs.uri }}

      - name: Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
